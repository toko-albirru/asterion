function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

$("list").addEventListener("pointerdown",function(e){
  var h=e.target.closest(".grab");if(!h||!isAdmin)return;
  e.preventDefault();
  var isCat=h.dataset.k==="c",item=h.closest(isCat?".cat":".link"),box=item.parentElement;

  function place(){item.style.transform="translateY("+(y-off-layoutTop())+"px) scale(1.02)"}
  function reorder(){
    var sibs=[].slice.call(box.children).filter(function(c){return c!==item});
    var before=null;
    for(var i=0;i<sibs.length;i++){var r=sibs[i].getBoundingClientRect();if(y<r.top+r.height/2){before=sibs[i];break}}
    if(item.nextSibling===before)return;
    var tops=sibs.map(function(s){return s.getBoundingClientRect().top});
    box.insertBefore(item,before);
    sibs.forEach(function(s,i){var d=tops[i]-s.getBoundingClientRect().top;if(d){s.style.transition="none";s.style.transform="translateY("+d+"px)";void s.offsetHeight;s.style.transition="transform .2s ease";s.style.transform=""}});
  }
  function tick(){
    if(done)return;
    if(y<80)window.scrollBy(0,-12);else if(y>innerHeight-80)window.scrollBy(0,12);
    reorder();place();raf=requestAnimationFrame(tick);
  }

    done=true;cancelAnimationFrame(raf);
    h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
    var order=[].map.call(box.children,function(c){return +c.dataset.i});

    },190);
  }
  h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);

});

    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMove()});
  }
  var link=data[si].l[li];
  sheetBg.innerHTML="";
  var sh=mk("div","sheet");
  sh.appendChild(mk("div","grip"));
  sh.appendChild(mk("h4",null,"PINDAH KE KATEGORI"));
  var who=mk("div","who","Memindahkan:");who.appendChild(mk("b",null,link.n));sh.appendChild(who);
  data.forEach(function(t,ti){
    var o=mk("button","opt");o.appendChild(mk("span","n",t.t));
    o.appendChild(mk("span","c",ti===si?"Saat ini":t.l.length+" link"));
    if(ti===si){o.disabled=true}
    else{
      o.appendChild(mk("span","a","→"));
      o.onclick=function(){
        var it=data[si].l.splice(li,1)[0];data[ti].l.push(it);
        closeMove();msg("Dipindah ke "+t.t+" ✓");save();
      };
    }
    sh.appendChild(o);
  });
  var c=mk("button","cancel","Batal");c.onclick=closeMove;sh.appendChild(c);
  sheetBg.appendChild(sh);
  requestAnimationFrame(function(){sheetBg.classList.add("on")});
}

function save(){
  render();
  fetch("/api/links",{method:"PUT",headers:{"content-type":"application/json","x-admin-password":adminPw},body:JSON.stringify(data)})
    .then(function(r){if(!r.ok)throw 0;msg("Tersimpan ✓")})
    .catch(function(){msg("Gagal menyimpan. Coba login ulang.",false)});
}

$("admBtn").onclick=function(){
  if(isAdmin){$("admin").classList.toggle("hide");return}
  $("login").classList.toggle("hide");$("pw").focus();
};
$("loginCancel").onclick=function(){$("login").classList.add("hide");$("pw").value="";$("loginMsg").textContent=""};
async function doLogin(){
  var pw=$("pw").value;
  try{
    var r=await fetch("/api/links",{method:"POST",headers:{"x-admin-password":pw}});
    if(!r.ok)throw 0;
    adminPw=pw;isAdmin=true;$("login").classList.add("hide");$("admin").classList.remove("hide");$("pw").value="";$("loginMsg").textContent="";$("admBtn").textContent="⚙️ Admin";render();
  }catch(e){$("loginMsg").textContent="Password salah.";$("loginMsg").style.color="#fca5a5"}
}
$("loginGo").onclick=doLogin;
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
$("logout").onclick=function(){isAdmin=false;adminPw="";$("admin").classList.add("hide");$("admBtn").textContent="🔒 Admin";render()};
$("addLink").onclick=function(){
  var n=$("ttl").value.trim(),u=$("url").value.trim(),i=$("sec").value;
  if(!n||!u||!data[i]){msg("Isi judul dan URL dulu.",false);return}
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  data[i].l.push({n:n,u:u});$("ttl").value="";$("url").value="";save();
};
$("addSec").onclick=function(){
  var t=$("nsec").value.trim();if(!t){msg("Isi nama kategori dulu.",false);return}
  data.push({t:t.toUpperCase(),l:[]});$("nsec").value="";save();
  $("sec").value=data.length-1;
};

render();

document.addEventListener("pointerdown",function(e){
  var a=e.target.closest&&e.target.closest(".link a");if(!a)return;
  a.classList.remove("pressed");void a.offsetWidth;a.classList.add("pressed");
  setTimeout(function(){a.classList.remove("pressed")},700);
});

fetch("/api/links",{cache:"no-store"}).then(function(r){return r.json()}).then(function(v){
  if(Array.isArray(v)&&!document.querySelector(".drag")){data=v;render()}
}).catch(function(){});
</script>
</body>
</html>
