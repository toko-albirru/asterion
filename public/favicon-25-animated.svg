<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="25">
  <defs>
    <radialGradient id="orb" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#5622a8"/>
      <stop offset=".48" stop-color="#32106f"/>
      <stop offset=".78" stop-color="#6827c9"/>
      <stop offset="1" stop-color="#c47cff"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a53cff"/>
      <stop offset=".55" stop-color="#7624e8"/>
      <stop offset="1" stop-color="#e1a0ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="20%" cy="12%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".35" stop-color="#d7a6ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="32" cy="32" r="29.2"/></clipPath>
  </defs>
  <g>
    <circle cx="32" cy="32" r="29.2" fill="url(#orb)" stroke="url(#rim)" stroke-width="1.2" filter="url(#glow)"/>
    <g clip-path="url(#clip)">
      <circle cx="32" cy="32" r="29.2" fill="url(#shine)"/>
      <ellipse cx="20" cy="9" rx="19" ry="5" fill="#fff" opacity=".12" transform="rotate(-28 20 9)"/>
      <ellipse cx="42" cy="59" rx="22" ry="8" fill="#e5b8ff" opacity=".18" filter="url(#glow)"/>
      <path d="M4 28 C10 7 25 1 39 3" fill="none" stroke="#e6c6ff" stroke-opacity=".24" stroke-width="1.2"/>
    </g>
    <text x="32" y="41.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="-1.1" fill="#fff" filter="url(#textGlow)">25</text>
    <circle cx="32" cy="32" r="29.2" fill="none" stroke="#d99aff" stroke-opacity=".55" stroke-width=".55">
      <animate attributeName="stroke-opacity" values=".35;.8;.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="32" cy="32" rx="29" ry="29" fill="none" stroke="#fff" stroke-opacity="0" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0;.24;0" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="28.7;30.2;28.7" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="28.7;30.2;28.7" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
